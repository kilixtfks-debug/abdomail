o{width:18px;text-align:center;font-size:17px}.side-label{padding:18px 20px 8px 26px;font-size:12px;color:var(--muted);font-weight:600}.main{background:var(--surface);border-radius:22px;min-height:calc(100vh - 82px);overflow:hidden}.toolbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid #f0f1f3}.tool{padding:9px 12px;background:transparent;border-radius:8px;color:var(--muted)}.tool:hover{background:#f1f3f4}.view-title{font-size:18px;font-weight:500;margin-right:auto}.email-row{display:grid;grid-template-columns:32px 30px minmax(130px,210px) minmax(0,1fr) 94px;align-items:center;gap:8px;padding:11px 20px;border-bottom:1px solid #f0f1f1;min-height:52px;cursor:pointer}.email-row:hover{box-shadow:0 1px 3px #0002;position:relative}.email-row.unread{background:#f2f6fc;font-weight:700}.email-row .sender,.email-row .subjectline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.email-row .preview{font-weight:400;color:var(--muted)}.email-row .date{text-align:right;color:var(--muted);font-size:12px;white-space:nowrap}.star{background:transparent;color:#9aa0a6;font-size:18px;padding:0}.star.on{color:#f9ab00}.rowcheck{accent-color:var(--blue)}.empty{padding:90px 20px;text-align:center;color:var(--muted)}.empty .big{font-size:40px;margin-bottom:12px}.welcome{padding:28px;border-bottom:1px solid var(--line)}.welcome h2{margin:0 0 5px;font-weight:500}.welcome p{margin:0;color:var(--muted)}.detail{padding:20px 28px}.detail-top{display:flex;gap:12px;align-items:center}.detail h2{font-size:23px;font-weight:400;margin:20px 0}.detail-body{padding:28px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}.detail-meta{color:var(--muted);font-size:13px}.pill{padding:8px 14px;border-radius:20px;background:#e8f0fe;color:#174ea6}.formwrap{max-width:520px;margin:36px auto;padding:0 24px}.formwrap h2{font-size:27px;font-weight:400}.field{display:block;margin:15px 0}.field span{display:block;margin-bottom:7px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid #c7cbd1;border-radius:8px;padding:12px;background:white;color:var(--ink)}.field textarea{min-height:180px;resize:vertical}.primary{background:#0b57d0;color:white;border-radius:24px;padding:11px 22px;font-weight:600}.primary:hover{background:#0842a0}.secondary{background:transparent;border:1px solid #c7cbd1;border-radius:22px;padding:10px 18px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:var(--muted)}.notice{margin:16px 0;padding:12px 14px;border-radius:10px;background:#e8f0fe;color:#174ea6}.danger{color:#b3261e}.settings-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 28px;border-bottom:1px solid var(--line)}.settings-tabs button{padding:14px 12px;background:transparent;border-bottom:3px solid transparent}.settings-tabs button.active{border-color:var(--blue);color:var(--blue)}.mobile-menu{display:none}
@media(max-width:800px){.top{padding:0 12px;gap:10px;height:60px}.brand{min-width:0;font-size:19px}.brand .brandname{display:none}.search{height:42px}.layout{grid-template-columns:1fr;padding:0 8px 10px}.sidebar{display:none;position:fixed;z-index:5;top:60px;left:0;bottom:0;width:270px;background:var(--bg);box-shadow:0 8px 20px #0002;padding:12px 10px 20px 0}.sidebar.open{display:block}.mobile-menu{display:grid}.main{min-height:calc(100vh - 70px);border-radius:16px}.email-row{grid-template-columns:22px 23px minmax(75px,110px) minmax(0,1fr);gap:6px;padding:12px 9px}.email-row .date{display:none}.toolbar{padding:0 10px}.detail{padding:16px}.formwrap{margin:24px auto}.top-actions{gap:2px}.top-actions .help{display:none}}

<body><div class="app" id="app">
<header class="top">
<button class="round mobile-menu" id="menuToggle" aria-label="Menu">☰</button>
<div class="brand"><div class="logo">A</div><span class="brandname">Abdo Mail</span></div>

<div class="top-actions"><button class="round help" title="Aide">?</button><button class="round" id="settingsShortcut" title="Paramètres">⚙</button><button class="round" title="Applications">⠿</button><button class="avatar" id="profileAvatar" title="Compte">A</button></div>
</header>
<div class="layout">
<aside class="sidebar" id="sidebar"><button class="compose" id="composeBtn"><span style="font-size:22px">✎</span> Nouveau message</button>
<nav id="nav"><button class="nav active" data-folder="inbox"><span class="ico">▣</span> Boîte de réception <span class="count" id="inboxCount"></span></button><button class="nav" data-folder="starred"><span class="ico">☆</span> Suivis</button><button class="nav" data-folder="snoozed"><span class="ico">◷</span> En attente</button><button class="nav" data-folder="sent"><span class="ico">➤</span> Messages envoyés</button><button class="nav" data-folder="drafts"><span class="ico">▤</span> Brouillons <span class="count" id="draftCount"></span></button><button class="nav" data-folder="archive"><span class="ico">▣</span> Tous les messages archivés</button><button class="nav" data-folder="spam"><span class="ico">⊘</span> Spam</button><button class="nav" data-folder="trash"><span class="ico">▤</span> Corbeille</button></nav>

<main class="main" id="main"><div class="toolbar"><button class="tool" id="selectAll" title="Tout sélectionner">□</button><button class="tool" id="refreshBtn" title="Actualiser">↻</button><button class="tool" id="archiveBtn" title="Archiver">▣</button><button class="tool" id="spamBtn" title="Signaler comme spam">!</button><button class="tool" id="deleteBtn" title="Supprimer">▤</button><button class="tool" id="moreBtn" title="Plus">⋮</button><div class="view-title" id="viewTitle">Boîte de réception</div></div><div id="content"></div></main>
</div></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://meftgquxeynfoizdcnvu.supabase.co';
const SUPABASE_KEY='sb_publishable_LDXbj1_xF-vQMpJT_hqwIg_1VN-SHO2';
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const folders={inbox:'Boîte de réception',starred:'Suivis',snoozed:'En attente',sent:'Messages envoyés',drafts:'Brouillons',archive:'Tous les messages archivés',spam:'Spam',trash:'Corbeille',settings:'Paramètres',account:'Mon compte',compose:'Nouveau message',detail:'Message'};
let currentFolder='inbox',messages=[],selected=new Set(),currentMessage=null,searchTerm='',settingsTab='general',user=null,profile={full_name:'',theme:'system',signature:''},labels=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){let n=document.createElement('div');n.className='notice';n.textContent=msg;$('content').prepend(n);setTimeout(()=>n.remove(),3500)}
function initials(){return (profile.full_name||user?.email||'A').trim().slice(0,1).toUpperCase()}
function folderOf(m){return m.folder||'inbox'}
function visibleMessages(){let arr=messages.filter(m=>{if(currentFolder==='starred')return m.is_starred&&!['trash','spam'].includes(folderOf(m));if(currentFolder==='snoozed')return folderOf(m)==='snoozed';if(currentFolder==='inbox')return folderOf(m)==='inbox';return folderOf(m)===currentFolder});if(searchTerm){const q=searchTerm.toLowerCase();arr=arr.filter(m=>[m.sender_email,m.recipient_email,m.subject,m.body].some(v=>(v||'').toLowerCase().includes(q)))}return arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))}
async function loadProfile(){if(!user)return;const {data}=await supabase.from('mail_profiles').select('*').eq('user_id',user.id).maybeSingle();if(data)profile={...profile,...data};}
async function loadMessages(){if(!user)return;const {data,error}=await supabase.from('mail_messages').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}).limit(500);if(error){toast('Impossible de charger les messages : '+error.message);return}messages=data||[];render()}
function updateNav(){document.querySelectorAll('.nav[data-folder]').forEach(b=>b.classList.toggle('active',b.dataset.folder===currentFolder));$('viewTitle').textContent=folders[currentFolder]||currentFolder;$('inboxCount').textContent=messages.filter(m=>folderOf(m)==='inbox'&&!m.is_read).length||'';$('draftCount').textContent=messages.filter(m=>folderOf(m)==='drafts').length||''}
function render(){updateNav();if(currentFolder==='settings'){renderSettings();return}if(currentFolder==='account'){renderAccount();return}if(currentFolder==='compose'){renderCompose();return}if(currentFolder==='detail'&&currentMessage){renderDetail();return}const arr=visibleMessages();$('content').innerHTML=arr.length?arr.map(m=>'<div class="email-row '+(!m.is_read?'unread':'')+'" data-id="'+m.id+'"><input class="rowcheck" type="checkbox" data-select="'+m.id+'" '+(selected.has(m.id)?'checked':'')+' aria-label="Sélectionner"><button class="star '+(m.is_starred?'on':'')+'" data-star="'+m.id+'" title="Suivi">'+(m.is_starred?'★':'☆')+'</button><div class="sender">'+esc(currentFolder==='sent'?m.recipient_email:m.sender_email||'Brouillon')+'</div><div class="subjectline"><span>'+esc(m.subject||'(Sans objet)')+'</span> <span class="preview">— '+esc((m.body||'').replace(/\s+/g,' ').slice(0,120))+'</span></div><div class="date">'+esc(new Date(m.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}))+'</div></div>').join(''):'<div class="empty"><div class="big">✉</div><div>'+(searchTerm?'Aucun résultat trouvé':'Aucun message ici')+'</div><p>Vos messages apparaîtront ici.</p></div>';document.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();el.checked?selected.add(el.dataset.select):selected.delete(el.dataset.select)}));document.querySelectorAll('[data-star]').forEach(el=>el.addEventListener('click',async e=>{e.stopPropagation();let m=messages.find(x=>x.id===el.dataset.star);if(m)await patch(m.id,{is_starred:!m.is_starred})}));document.querySelectorAll('.email-row').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('button,input'))return;openMessage(el.dataset.id)}))}
async function patch(id,updates){const {error}=await supabase.from('mail_messages').update(updates).eq('id',id).eq('owner_id',user.id);if(error)toast(error.message);else{messages=messages.map(m=>m.id===id?{...m,...updates,updated_at:new Date().toISOString()}:m);render()}}
async function openMessage(id){currentMessage=messages.find(m=>m.id===id);if(!currentMessage)return;if(!currentMessage.is_read&&currentMessage.folder!=='drafts')await patch(id,{is_read:true});currentFolder='detail';render()}
function renderDetail(){let m=currentMessage;$('viewTitle').textContent='Message';$('content').innerHTML='<div class="detail"><div class="actions"><button class="secondary" id="backInbox">← Retour</button><button class="secondary" id="detailArchive">Archiver</button><button class="secondary" id="detailDelete">Supprimer</button><button class="secondary" id="detailStar">'+(m.is_starred?'★ Retirer le suivi':'☆ Suivre')+'</button></div><h2>'+esc(m.subject||'(Sans objet)')+'</h2><div class="detail-top"><div class="avatar">'+esc((m.sender_email||'?')[0].toUpperCase())+'</div><div><strong>'+esc(m.sender_email||'Brouillon')+'</strong><div class="detail-meta">À : '+esc(m.recipient_email||'')+' · '+esc(new Date(m.created_at).toLocaleString('fr-FR'))+'</div></div></div><div class="detail-body">'+esc(m.body)+'</div><div class="actions"><button class="primary" id="replyBtn">↩ Répondre</button><button class="secondary" id="forwardBtn">Transférer</button></div></div>';$('backInbox').onclick=()=>{currentFolder='inbox';currentMessage=null;render()};$('detailArchive').onclick=()=>moveCurrent('archive');$('detailDelete').onclick=()=>moveCurrent('trash');$('detailStar').onclick=async()=>{await patch(m.id,{is_starred:!m.is_starred});currentMessage=messages.find(x=>x.id===m.id);render()};$('replyBtn').onclick=()=>{currentFolder='compose';renderCompose({recipient:m.sender_email,subject:'Re : '+m.subject,body:'\n\n—— Message original ——\n'+m.body})};$('forwardBtn').onclick=()=>{currentFolder='compose';renderCompose({subject:'Tr : '+m.subject,body:'\n\n—— Message transféré ——\n'+m.body})}}
async function moveCurrent(folder){if(!currentMessage)return;await patch(currentMessage.id,{folder});currentMessage=null;currentFolder='inbox';render()}
function renderCompose(initial={}){$('viewTitle').textContent='Nouveau message';$('content').innerHTML='<div class="formwrap" style="max-width:760px"><h2>Nouveau message</h2><form id="composeForm"><label class="field"><span>À</span><input id="to" type="email" placeholder="destinataire@exemple.com" value="'+esc(initial.recipient||'')+'" required></label><label class="field"><span>Objet</span><input id="subject" placeholder="Objet" value="'+esc(initial.subject||'')+'"></label><label class="field"><span>Message</span><textarea id="body" placeholder="Rédigez votre message...">'+esc(initial.body||'')+'</textarea></label><div class="actions"><button class="primary" type="submit">➤ Envoyer</button><button class="secondary" type="button" id="saveDraft">Enregistrer le brouillon</button><button class="secondary" type="button" id="discardDraft">Annuler</button></div><p class="muted">Pour le moment, l’envoi réel d’e-mails nécessite de connecter un service d’envoi (SMTP ou API e-mail).</p></form></div>';$('composeForm').onsubmit=async e=>{e.preventDefault();await saveMessage('sent');toast('Copie enregistrée dans Messages envoyés. L’envoi externe n’est pas encore activé.');currentFolder='sent';render()};$('saveDraft').onclick=async()=>{await saveMessage('drafts');currentFolder='drafts';render()};$('discardDraft').onclick=()=>{currentFolder='inbox';render()}}
async function saveMessage(folder){const payload={owner_id:user.id,sender_email:user.email,recipient_email:$('to').value.trim(),subject:$('subject').value.trim(),body:$('body').value,folder,is_read:true};const {error}=await supabase.from('mail_messages').insert(payload);if(error){toast('Erreur : '+error.message);return}await loadMessages()}
function renderSettings(){$('viewTitle').textContent='Paramètres';$('content').innerHTML='<div class="settings-tabs"><button data-tab="general" class="'+(settingsTab==='general'?'active':'')+'">Général</button><button data-tab="account" class="'+(settingsTab==='account'?'active':'')+'">Compte</button><button data-tab="appearance" class="'+(settingsTab==='appearance'?'active':'')+'">Apparence</button><button data-tab="security" class="'+(settingsTab==='security'?'active':'')+'">Sécurité</button></div><div class="formwrap"><h2>'+({general:'Paramètres généraux',account:'Votre compte',appearance:'Apparence',security:'Sécurité'}[settingsTab])+'</h2><form id="settingsForm">'+(settingsTab==='general'?'<label class="field"><span>Nom affiché</span><input id="profileName" value="'+esc(profile.full_name||'')+'" placeholder="Votre nom"></label><label class="field"><span>Signature</span><textarea id="signature" placeholder="Votre signature">'+esc(profile.signature||'')+'</textarea></label><label class="field"><span>Langue</span><select id="language"><option>Français</option><option>العربية</option><option>English</option></select></label>':settingsTab==='appearance'?'<label class="field"><span>Thème</span><select id="theme"><option value="system">Selon le système</option><option value="light">Clair</option><option value="dark">Sombre</option></select></label><p class="muted">La personnalisation du thème sera appliquée dans une prochaine mise à jour.</p>':settingsTab==='account'?'<p>Adresse e-mail : <strong>'+esc(user.email)+'</strong></p><p>Nom : '+esc(profile.full_name||'Non défini')+'</p><button class="secondary" type="button" id="resetPassword">Réinitialiser le mot de passe</button>': '<p>Connecté avec Supabase Auth.</p><p class="muted">Utilisez un mot de passe unique et gardez votre compte sécurisé.</p><button class="secondary" type="button" id="resetPassword">Réinitialiser le mot de passe</button>')+'<div class="actions"><button class="primary" type="submit">Enregistrer</button><button class="secondary" type="button" id="signOut">Se déconnecter</button></div></form></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{settingsTab=b.dataset.tab;renderSettings()});$('settingsForm').onsubmit=async e=>{e.preventDefault();if(settingsTab==='general'){profile.full_name=$('profileName').value;profile.signature=$('signature').value;const {error}=await supabase.from('mail_profiles').upsert({user_id:user.id,full_name:profile.full_name,signature:profile.signature},{onConflict:'user_id'});if(error){toast(error.message);return}}if(settingsTab==='appearance')profile.theme=$('theme').value;toast('Paramètres enregistrés');$('profileAvatar').textContent=initials()};$('signOut').onclick=async()=>{await supabase.auth.signOut();location.reload()};if($('resetPassword'))$('resetPassword').onclick=async()=>{const {error}=await supabase.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin+location.pathname});toast(error?error.message:'E-mail de réinitialisation demandé.')}}
function renderAccount(){$('viewTitle').textContent='Mon compte';$('content').innerHTML='<div class="formwrap"><div class="avatar" style="width:64px;height:64px;font-size:25px">'+esc(initials())+'</div><h2>'+esc(profile.full_name||'Votre compte Abdo Mail')+'</h2><p>'+esc(user.email)+'</p><p class="muted">Gérez vos informations personnelles et votre connexion.</p><div class="actions"><button class="primary" id="accountSettings">Gérer le compte</button><button class="secondary" id="accountLogout">Se déconnecter</button></div></div>';$('accountSettings').onclick=()=>{currentFolder='settings';settingsTab='general';render()};$('accountLogout').onclick=async()=>{await supabase.auth.signOut();location.reload()}}
function showAuth(mode='login',msg=''){$('app').classList.add('hidden');$('authScreen').classList.remove('hidden');$('authScreen').innerHTML='<div class="formwrap" style="background:white;border:1px solid #e3e7ee;border-radius:24px;padding:32px;margin-top:7vh"><div class="brand" style="margin-bottom:25px"><div class="logo">A</div><span>Abdo Mail</span></div><h2>'+(mode==='login'?'Connectez-vous':'Créer votre compte')+'</h2><p class="muted">'+(mode==='login'?'Accédez à votre messagerie':'Inscrivez-vous pour commencer')+'</p>'+(msg?'<div class="notice">'+esc(msg)+'</div>':'')+'<form id="authForm">'+(mode==='signup'?'<label class="field"><span>Nom complet</span><input id="authName" required placeholder="Votre nom"></label>':'')+'<label class="field"><span>Adresse e-mail</span><input id="authEmail" type="email" required placeholder="vous@exemple.com"></label><label class="field"><span>Mot de passe</span><input id="authPassword" type="password" required minlength="6" placeholder="6 caractères minimum"></label><div class="actions"><button class="primary" type="submit">'+(mode==='login'?'Se connecter':'Créer mon compte')+'</button></div></form><p><button id="switchAuth" class="tool">'+(mode==='login'?'Créer un compte':'J’ai déjà un compte')+'</button> <button id="forgot" class="tool">Mot de passe oublié ?</button></p><p class="muted" style="font-size:12px">Abdo Mail est une application indépendante et n’est pas un service Google.</p></div>';$('switchAuth').onclick=()=>showAuth(mode==='login'?'signup':'login');$('forgot').onclick=async()=>{const email=$('authEmail').value.trim();if(!email)return showAuth(mode,'Saisissez votre e-mail puis réessayez.');const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});showAuth(mode,error?error.message:'Consultez votre boîte e-mail si cette adresse est enregistrée.')};$('authForm').onsubmit=async e=>{e.preventDefault();const email=$('authEmail').value.trim(),password=$('authPassword').value;if(mode==='login'){const {error}=await supabase.auth.signInWithPassword({email,password});if(error)showAuth(mode,error.message);else await boot()}else{const {data,error}=await supabase.auth.signUp({email,password,options:{data:{full_name:$('authName').value.trim()}}});if(error){showAuth(mode,error.message);return}if(data.session){await boot()}else showAuth('login','Compte créé. Si la confirmation e-mail est activée dans Supabase, confirmez votre adresse avant de vous connecter.')}}}
async function boot(){const {data}=await supabase.auth.getSession();user=data.session?.user||null;if(!user){showAuth();return} $('authScreen').classList.add('hidden');$('app').classList.remove('hidden');$('profileAvatar').textContent=initials();await loadProfile();$('profileAvatar').textContent=initials();await loadMessages()}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-folder]');if(!b)return;currentFolder=b.dataset.folder;currentMessage=null;selected.clear();render();$('sidebar').classList.remove('open')});
$('composeBtn').onclick=()=>{currentFolder='compose';renderCompose()};$('settingsShortcut').onclick=()=>{currentFolder='settings';settingsTab='general';render()};$('profileAvatar').onclick=()=>{currentFolder='account';render()};$('menuToggle').onclick=()=>$('sidebar').classList.toggle('open');
$('searchInput').addEventListener('input',e=>{searchTerm=e.target.value;currentFolder='inbox';render()});$('clearSearch').onclick=()=>{$('searchInput').value='';searchTerm='';render()};$('refreshBtn').onclick=loadMessages;$('selectAll').onclick=()=>{const arr=visibleMessages();if(arr.every(m=>selected.has(m.id)))selected.clear();else arr.forEach(m=>selected.add(m.id));render()};
async function bulk(updates){if(!selected.size){toast('Sélectionnez au moins un message.');return}const ids=[...selected];const {error}=await supabase.from('mail_messages').update(updates).in('id',ids).eq('owner_id',user.id);if(error)toast(error.message);else{messages=messages.map(m=>ids.includes(m.id)?{...m,...updates}:m);selected.clear();render()}}
$('archiveBtn').onclick=()=>bulk({folder:'archive'});$('spamBtn').onclick=()=>bulk({folder:'spam'});$('deleteBtn').onclick=()=>bulk({folder:'trash'});$('moreBtn').onclick=()=>{if(!selected.size){toast('Sélectionnez un message pour afficher plus d’actions.');return}const action=prompt('Action : read, unread, inbox, permanent');if(action==='read')bulk({is_read:true});else if(action==='unread')bulk({is_read:false});else if(action==='inbox')bulk({folder:'inbox'});else if(action==='permanent')permanentDelete()};
async function permanentDelete(){if(!confirm('Supprimer définitivement les messages sélectionnés ?'))return;const {error}=await supabase.from('mail_messages').delete().in('id',[...selected]).eq('owner_id',user.id);if(error)toast(error.message);else{messages=messages.filter(m=>!selected.has(m.id));selected.clear();render()}}
$('addLabel').onclick=()=>{const label=prompt('Nom du libellé');if(label){labels.push(label);$('labels').innerHTML=labels.map(x=>'<div class="nav"><span class="ico">◆</span>'+esc(x)+'</div>').join('')}};
const {data:authListener}=supabase.auth.onAuthStateChange((_event,session)=>{if(session?.user&&!user){user=session.user;boot()}});
boot();
</script></body></html>
